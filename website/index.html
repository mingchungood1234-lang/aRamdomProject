<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f0f0f" />
  <title>YouTube</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="yt-app">

  <!-- =========================================================================
       1. DEFAULT YOUTUBE MOBILE HEADER
       ========================================================================= -->
  <header class="yt-header">
    <!-- Left: YouTube Official Wordmark & Logo -->
    <div class="yt-brand" onclick="window.app.goHome()">
      <svg class="yt-logo-svg" viewBox="0 0 90 20" preserveAspectRatio="xMidYMid meet">
        <g>
          <path fill="#FF0000" d="M27.97 3.12A3.5 3.5 0 0 0 25.5.65C23.32.07 14.5.07 14.5.07s-8.82 0-11 .58A3.5 3.5 0 0 0 1.03 3.12C.45 5.3.45 9.85.45 9.85s0 4.55.58 6.73a3.5 3.5 0 0 0 2.47 2.47c2.18.58 11 .58 11 .58s8.82 0 11-.58a3.5 3.5 0 0 0 2.47-2.47c.58-2.18.58-6.73.58-6.73s0-4.55-.58-6.73z"/>
          <polygon fill="#FFFFFF" points="11.69 14.07 19.19 9.85 11.69 5.62 11.69 14.07"/>
          <text x="32" y="15" fill="#FFFFFF" font-family="-apple-system, Roboto, Helvetica, Arial" font-weight="700" font-size="14.5" letter-spacing="-0.8">YouTube</text>
        </g>
      </svg>
    </div>

    <!-- Right Header Controls: Search & Avatar -->
    <div class="yt-header-icons">
      <button id="btn-open-search" class="yt-icon-btn" aria-label="Search">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 14z"/></svg>
      </button>
      <div class="yt-avatar-circle" onclick="window.app.switchView('library')">
        <span>U</span>
      </div>
    </div>

    <!-- YouTube Mobile Fullscreen Search Overlay -->
    <div id="yt-search-overlay" class="yt-search-overlay" style="display: none;">
      <button id="btn-close-search" class="yt-icon-btn" aria-label="Close search">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <form id="yt-search-form" class="yt-search-bar-form">
        <input id="yt-search-input" type="text" placeholder="Search YouTube or paste link..." autocomplete="off" spellcheck="false" />
        <button type="button" id="btn-clear-yt-search" class="yt-btn-clear" style="display: none;">&times;</button>
      </form>
      <button id="btn-submit-search" class="yt-icon-btn" aria-label="Submit search">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 14z"/></svg>
      </button>

      <!-- Autocomplete Dropdown List -->
      <div id="yt-search-suggestions" class="yt-suggestions-list" style="display: none;"></div>
    </div>
  </header>

  <!-- =========================================================================
       2. DEFAULT YOUTUBE CATEGORY FILTER CHIPS
       ========================================================================= -->
  <nav class="yt-chips-container">
    <div class="yt-chips-scroll">
      <button class="yt-chip active" data-category="All">All</button>
      <button class="yt-chip" data-category="Music">Music</button>
      <button class="yt-chip" data-category="Lofi">Lofi & Beats</button>
      <button class="yt-chip" data-category="Ambience">Ambience</button>
      <button class="yt-chip" data-category="Focus">Study & Focus</button>
      <button class="yt-chip" data-category="Podcasts">Podcasts</button>
      <button class="yt-chip" data-category="Gaming">Gaming</button>
      <button class="yt-chip" data-category="Live">Live</button>
    </div>
  </nav>

  <!-- =========================================================================
       3. MAIN YOUTUBE APP CONTENT CONTAINER
       ========================================================================= -->
  <main class="yt-main-content">

    <!-- ACTIVE VIDEO WATCH VIEW (Appears at top when video plays) -->
    <section id="yt-watch-section" class="yt-watch-section" style="display: none;">
      <!-- 16:9 Video Frame with Native YouTube Controls -->
      <div class="yt-player-wrapper">
        <div id="yt-player-container"></div>
      </div>

      <!-- Dedicated Audio Mode Banner (Visible when Audio Only is active) -->
      <div id="yt-audio-mode-banner" class="yt-audio-mode-banner" style="display: none;">
        <img id="yt-audio-banner-thumb" class="yt-audio-thumb" src="" alt="Thumbnail" />
        <div class="yt-audio-banner-text">
          <div class="yt-audio-badge">
            <svg viewBox="0 0 24 24"><path d="M12 3v9.28a4.39 4.39 0 0 0-1.5-.28 4.5 4.5 0 1 0 4.5 4.5V6h4V3h-7z"/></svg>
            <span>Background Audio Stream</span>
          </div>
          <div id="yt-audio-banner-title" class="yt-audio-title">Title</div>
          <div id="yt-audio-banner-channel" class="yt-audio-channel">Channel</div>
        </div>
        <div class="yt-audio-controls">
          <button class="yt-audio-ctrl-btn" onclick="window.playerManager.seekRelative(-10)" aria-label="Rewind 10s">
            <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
          </button>
          <button id="btn-audio-play-toggle" class="yt-audio-ctrl-btn play-btn" onclick="window.playerManager.togglePlay()" aria-label="Play/Pause">
            <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button class="yt-audio-ctrl-btn" onclick="window.playerManager.seekRelative(10)" aria-label="Forward 10s">
            <svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg>
          </button>
        </div>
      </div>

      <!-- Signature YouTube Red Scrubber Progress Bar & Time Tracker -->
      <div class="yt-progress-container">
        <div class="yt-progress-track">
          <div id="yt-progress-bar" class="yt-progress-fill" style="width: 0%;"></div>
          <input id="yt-progress-slider" type="range" class="yt-progress-range" min="0" max="100" value="0" step="0.1" aria-label="Seek progress" />
        </div>
        <div class="yt-progress-time-row">
          <span id="yt-time-current" class="yt-time-label">0:00</span>
          <span class="yt-time-sep">/</span>
          <span id="yt-time-duration" class="yt-time-label">0:00</span>
        </div>
      </div>

      <!-- Watch Details: Title, Channel, Actions (Default YouTube Layout) -->
      <div class="yt-watch-info">
        <h1 id="yt-video-title" class="yt-watch-title">Select a video to play</h1>
        <div id="yt-video-views-date" class="yt-watch-meta">1.2M views • Background Play Active</div>

        <!-- Channel Subscribe Row -->
        <div class="yt-channel-bar">
          <div class="yt-channel-left">
            <div id="yt-channel-avatar" class="yt-channel-avatar-circle">YT</div>
            <div class="yt-channel-text">
              <span id="yt-channel-name" class="yt-channel-name">YouTube</span>
              <span id="yt-channel-subs" class="yt-channel-subs">1.5M subscribers</span>
            </div>
          </div>
          <button id="btn-subscribe" class="yt-btn-subscribe" onclick="window.app.toggleSubscribe()">Subscribe</button>
        </div>

        <!-- Action Pills: Like, Share, Background Audio, Save -->
        <div class="yt-actions-scroll">
          <button id="btn-like" class="yt-action-pill" onclick="window.app.toggleLike()">
            <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
            <span id="like-count-text">42K</span>
          </button>

          <button class="yt-action-pill" onclick="window.app.shareVideo()">
            <svg viewBox="0 0 24 24"><path d="M14 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg>
            <span>Share</span>
          </button>

          <!-- Background Audio Stream Mode Button -->
          <button id="btn-audio-only" class="yt-action-pill" onclick="window.playerManager.toggleAudioOnlyMode()">
            <svg viewBox="0 0 24 24"><path d="M12 3v9.28a4.39 4.39 0 0 0-1.5-.28 4.5 4.5 0 1 0 4.5 4.5V6h4V3h-7z"/></svg>
            <span id="audio-mode-label">Background Audio</span>
          </button>

          <button id="btn-favorite" class="yt-action-pill" onclick="window.app.toggleFavoriteCurrentVideo()">
            <svg viewBox="0 0 24 24"><path d="M14 10H2v2h12v-2zm0-4H2v2h12V6zm4 8v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zM2 16h8v-2H2v2z"/></svg>
            <span>Save</span>
          </button>
        </div>

        <div class="yt-watch-divider"></div>

        <!-- Up Next Recommended Section -->
        <h2 class="yt-section-heading">Up next</h2>
        <div id="up-next-feed" class="yt-feed-list"></div>
      </div>
    </section>

    <!-- VIEW 1: HOME FEED (Default YouTube Mobile Grid) -->
    <div id="view-home" class="yt-tab-view active">
      <div id="feeds-grid" class="yt-feed-list"></div>
    </div>

    <!-- VIEW 2: SEARCH RESULTS -->
    <div id="view-search" class="yt-tab-view">
      <div class="yt-search-results-header">
        <h2 id="search-query-title" class="yt-section-heading">Search Results</h2>
        <span id="search-result-count" class="yt-meta-text"></span>
      </div>
      <div id="search-results-container" class="yt-feed-list"></div>
    </div>

    <!-- VIEW 3: SUBSCRIPTIONS -->
    <div id="view-subscriptions" class="yt-tab-view">
      <h2 class="yt-section-heading" style="padding: 16px 16px 8px 16px;">Latest from subscriptions</h2>
      <div id="subscriptions-feed" class="yt-feed-list"></div>
    </div>

    <!-- VIEW 4: LIBRARY ("You") -->
    <div id="view-library" class="yt-tab-view">
      <div class="yt-library-header">
        <div class="yt-avatar-large">U</div>
        <div>
          <h2 class="yt-section-heading" style="margin: 0;">You</h2>
          <span class="yt-meta-text">Saved Videos & Playback History</span>
        </div>
      </div>

      <h3 class="yt-library-subheading">Favorites</h3>
      <div id="favorites-list" class="yt-feed-list"></div>

      <h3 class="yt-library-subheading" style="margin-top: 24px;">History</h3>
      <div id="history-list" class="yt-feed-list"></div>
    </div>

  </main>

  <!-- Floating Go Back Button (Bottom Right Corner) -->
  <button id="floating-back-btn" class="floating-back-btn" aria-label="Go Back">
    <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
  </button>

  <!-- =========================================================================
       4. DEFAULT YOUTUBE MOBILE BOTTOM NAVIGATION BAR
       ========================================================================= -->
  <nav class="yt-bottom-nav">
    <button class="yt-nav-btn active" data-view="home">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </button>
    <button class="yt-nav-btn" data-view="subscriptions">
      <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/></svg>
      <span>Subscriptions</span>
    </button>
    <button class="yt-nav-btn" data-view="library">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
      <span>You</span>
    </button>
  </nav>

  <!-- Native HTML5 Background Audio Stream Element -->
  <audio id="native-audio" preload="auto" playsinline style="display: none;"></audio>

  <!-- JavaScript Modules -->
  <script src="js/background-audio.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
